name: Build Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-packages:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows Zip
            os: windows-latest
            maker: zip
            forge_platform: win32
            forge_arch: x64
            release_platform: windows
            release_arch: x64
            release_ext: zip
            artifact_name: mmd-modoki-windows-x64-zip
          - label: macOS Zip
            os: macos-15
            maker: zip
            forge_platform: darwin
            forge_arch: ''
            release_platform: mac
            release_arch: ''
            release_ext: zip
            artifact_name: mmd-modoki-macos-zip
          - label: macOS DMG
            os: macos-15
            maker: dmg
            forge_platform: darwin
            forge_arch: arm64
            release_platform: mac
            release_arch: arm64
            release_ext: dmg
            artifact_name: mmd-modoki-macos-arm64-dmg
          - label: Linux Zip
            os: ubuntu-latest
            maker: zip
            forge_platform: linux
            forge_arch: x64
            release_platform: linux
            release_arch: x64
            release_ext: zip
            artifact_name: mmd-modoki-linux-x64-zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Critical typecheck
        run: npm run typecheck:critical

      - name: Build release package
        shell: bash
        run: |
          ARGS=(-- --platform="${FORGE_PLATFORM}")
          if [ -n "${FORGE_ARCH}" ]; then
            ARGS+=(--arch="${FORGE_ARCH}")
          fi
          npm run "make:${MAKER}" "${ARGS[@]}"
        env:
          MAKER: ${{ matrix.maker }}
          FORGE_PLATFORM: ${{ matrix.forge_platform }}
          FORGE_ARCH: ${{ matrix.forge_arch }}

      - name: Rename package for release
        shell: bash
        run: |
          PACKAGE_DIR="out/make/${MAKER}/${FORGE_PLATFORM}"
          if [ -n "${FORGE_ARCH}" ]; then
            PACKAGE_DIR="$PACKAGE_DIR/${FORGE_ARCH}"
          fi
          shopt -s nullglob globstar
          packages=("$PACKAGE_DIR"/**/*."$RELEASE_EXT")
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one .$RELEASE_EXT file under $PACKAGE_DIR, found:"
            printf '  %s\n' "${packages[@]}"
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          SOURCE="${packages[0]}"
          TARGET_DIR="$(dirname "$SOURCE")"
          if [ -n "$RELEASE_ARCH" ]; then
            TARGET="$TARGET_DIR/MMD.modoki-${RELEASE_PLATFORM}-${RELEASE_ARCH}-${VERSION}.${RELEASE_EXT}"
          else
            TARGET="$TARGET_DIR/MMD.modoki-${RELEASE_PLATFORM}-${VERSION}.${RELEASE_EXT}"
          fi
          if [ "$SOURCE" != "$TARGET" ]; then
            mv "$SOURCE" "$TARGET"
          fi
          echo "Renamed $(basename "$SOURCE") -> $(basename "$TARGET")"
        env:
          MAKER: ${{ matrix.maker }}
          FORGE_PLATFORM: ${{ matrix.forge_platform }}
          FORGE_ARCH: ${{ matrix.forge_arch }}
          RELEASE_PLATFORM: ${{ matrix.release_platform }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
          RELEASE_EXT: ${{ matrix.release_ext }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            out/make/**/*.zip
            out/make/**/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release Assets
    needs: build-packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mmd-modoki-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MMD modoki ${{ github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.dmg
